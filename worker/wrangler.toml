name = "curio-api"
main = "src/index.js"
compatibility_date = "2025-05-01"

# 公开访问 + 路由
workers_dev = true

# 自有域名路由（curioradar.fun 通过后启用）
routes = [
  { pattern = "api.curioradar.fun/*", zone_name = "curioradar.fun" }
]

[[kv_namespaces]]
binding = "CURIO_KV"
id = "728863a1457247388acb6b866e09ae05"

# vars 是非密文配置
[vars]
SITE_BASE = "https://curioradar.fun"
API_BASE = "https://api.curioradar.fun"
# 发件人：用已验证的自有域名（Resend Verified 2026-05-31）
# 任何邮箱都能收到，不再受 sandbox 限制
FROM_EMAIL = "Curio <noreply@curioradar.fun>"
GH_REPO = "zczxd1118/curio-app"

# secrets 用 wrangler secret put 注入：
#   RESEND_API_KEY
#   ADMIN_TOKEN（用于 automation 调 /broadcast 鉴权）
