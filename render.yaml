services:
  - type: web
    name: curio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python agent/render_site.py
    startCommand: gunicorn server:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
