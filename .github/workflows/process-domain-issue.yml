name: Process Add-Domain Issue

# 当带 curio-add-domain 标签的 issue 被打开时立即触发
# 跑 ingest_add_domain → 把新领域写入 sources.yaml + 生成 explore.json
# 然后立即触发一次 fetch-candidates（用 workflow_dispatch）
on:
  issues:
    types: [opened, labeled, reopened]

jobs:
  ingest:
    # 只对带 curio-add-domain 标签的 issue 跑
    if: contains(github.event.issue.labels.*.name, 'curio-add-domain')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest add-domain issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_add_domain

      - name: Commit & push sources.yaml
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add sources.yaml topics/*.explore.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(ci): add domain via issue #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Trigger fetch-candidates immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # issue 处理完后立即跑一次抓取，让新领域 5 分钟内生效
          gh workflow run fetch-candidates.yml -f reason="add-domain #${{ github.event.issue.number }}"
