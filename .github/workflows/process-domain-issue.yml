name: Process Curio Issue

# 当带 curio-add-domain 或 curio-generate 标签的 issue 被打开时立即触发
# - curio-add-domain: 跑 ingest_add_domain → 写 sources.yaml + 生成 explore.json
# - curio-generate: 跑 ingest_generate → 写 .pending_generate.json，评论"已排队"
# 两种情况都会立即触发一次 fetch-candidates（让候选池在 5 分钟内更新）
on:
  issues:
    types: [opened, labeled, reopened]

# 防双跑：同一个 issue 同时只允许 1 个 run；新触发会取消老的
concurrency:
  group: process-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ingest-add-domain:
    # 兼容 label 没贴上的情况：title 前缀也算
    if: |
      contains(github.event.issue.labels.*.name, 'curio-add-domain') ||
      startsWith(github.event.issue.title, '[curio-add-domain]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Auto-label issue if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | grep -q '^curio-add-domain$'; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label curio-add-domain || true
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest add-domain issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_add_domain

      - name: Commit & push sources.yaml
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add sources.yaml topics/*.explore.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(ci): add domain via issue #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Check scoring mode
        id: addmode
        run: |
          mode=$(curl -sf https://api.curioradar.fun/scoring-mode | python -c "
          import sys, json
          try:
              d = json.load(sys.stdin); print(d.get('scoring_mode','local'))
          except: print('local')
          ")
          echo "mode=$mode" >> $GITHUB_OUTPUT

      - name: Inline fetch + score + finalize (api 模式)
        if: steps.addmode.outputs.mode == 'api'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURIO_ADMIN_TOKEN: ${{ secrets.CURIO_ADMIN_TOKEN }}
          CURIO_API_BASE: https://api.curioradar.fun
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CURIO_GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          python cli_generate.py prepare_unified
          python -m agent.score_with_llm
          python cli_generate.py finalize_unified --cadence daily

      - name: Commit & push generated content (add-domain api)
        if: steps.addmode.outputs.mode == 'api'
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add topics/unified.scored.json topics/radar.*.md topics/*.weekly.*.md topics/*.candidates.json topics/unified.*.md topics/unified.*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): generate from add-domain #${{ github.event.issue.number }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Inline fetch only (local/off 模式)
        if: steps.addmode.outputs.mode != 'api'
        run: |
          python cli_generate.py prepare_unified || echo "prepare 失败"
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add topics/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): refresh candidates from add-domain #${{ github.event.issue.number }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      - name: Close issue silently (不发评论邮件)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --reason completed || true
          gh issue edit ${{ github.event.issue.number }} --add-label curio-ingested || true

  ingest-delete-domain:
    if: |
      contains(github.event.issue.labels.*.name, 'curio-delete-domain') ||
      startsWith(github.event.issue.title, '[curio-delete-domain]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Auto-label issue if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | grep -q '^curio-delete-domain$'; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label curio-delete-domain || true
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest delete-domain issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURIO_ADMIN_TOKEN: ${{ secrets.CURIO_ADMIN_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_delete_domain

      - name: Commit & push sources.yaml
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add sources.yaml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(ci): delete domain via issue #${{ github.event.issue.number }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

      - name: Close issue silently (不发评论邮件)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --reason completed || true
          gh issue edit ${{ github.event.issue.number }} --add-label curio-ingested || true

  ingest-generate:
    if: |
      contains(github.event.issue.labels.*.name, 'curio-generate') ||
      startsWith(github.event.issue.title, '[curio-generate]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Auto-label issue if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | grep -q '^curio-generate$'; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label curio-generate || true
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest generate issue (写 .pending_generate.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_generate

      - name: Commit & push pending queue
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add .pending_generate.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更（可能已经在 pending 中）"
          else
            git commit -m "chore(ci): queue generate request from issue #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Check scoring mode (公开端点，不需 secret)
        id: mode
        run: |
          mode=$(curl -sf https://api.curioradar.fun/scoring-mode | python -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('scoring_mode', 'local'))
          except Exception:
              print('local')
          ")
          echo "mode=$mode" >> $GITHUB_OUTPUT
          echo "scoring_mode=$mode"

      - name: Inline fetch + score + finalize (api mode 直接同 workflow 跑通)
        if: steps.mode.outputs.mode == 'api'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURIO_ADMIN_TOKEN: ${{ secrets.CURIO_ADMIN_TOKEN }}
          CURIO_API_BASE: https://api.curioradar.fun
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CURIO_GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          echo "🔄 step 1/3: prepare_unified（抓 5 域 + 预筛 + 写 prompt）"
          python cli_generate.py prepare_unified
          echo "⚡ step 2/3: score_with_llm（DeepSeek API 评分）"
          python -m agent.score_with_llm
          echo "📤 step 3/3: finalize_unified（拆分 + 渲染 + push KV + 邮件）"
          python cli_generate.py finalize_unified --cadence daily

      - name: Commit & push generated content (api mode)
        if: steps.mode.outputs.mode == 'api'
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add topics/unified.scored.json topics/radar.*.md topics/*.weekly.*.md topics/*.candidates.json topics/unified.*.md topics/unified.*.json topics/_run_plan.json topics/_notes_plan.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(ci): generate from issue #${{ github.event.issue.number }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Close issue silently (api mode, 不发评论邮件)
        if: steps.mode.outputs.mode == 'api'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          # 不带 --comment 关闭，避免触发 GitHub notification 邮件
          gh issue close $ISSUE_NUM --reason completed || echo "close 失败但已尝试"
          gh issue edit $ISSUE_NUM --add-label curio-ingested || true

      - name: Inline fetch only (local/off mode)
        if: steps.mode.outputs.mode != 'api'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # local/off 模式：只抓候选，评分留给本地 WorkBuddy
          python cli_generate.py prepare_unified || echo "prepare 失败但继续"

      - name: Push topics changes (local/off mode)
        if: steps.mode.outputs.mode != 'api'
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add topics/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): refresh candidates from issue #${{ github.event.issue.number }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      - name: Update issue body (silent, 不触发 notification)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 不发 comment（comment 会触发 GitHub email notification）
          # 改成把状态写到 issue body 末尾，编辑 body 不发邮件
          ISSUE_NUM=${{ github.event.issue.number }}
          MODE="${{ steps.mode.outputs.mode }}"
          OLD_BODY=$(gh issue view $ISSUE_NUM --json body --jq .body)
          if [ "$MODE" = "api" ]; then
            STATUS="✅ 已收到（API 模式）— 预计 5-7 分钟内主页 + 邮箱可见"
          elif [ "$MODE" = "off" ]; then
            STATUS="⏸ 当前模式为暂停，请去主页设置切换"
          else
            STATUS="✅ 已收到（本地模式）— 5-65 分钟生效"
          fi
          gh issue edit $ISSUE_NUM --body "$OLD_BODY

          ---
          $STATUS"

      # local/off 模式：关闭 issue（防止积压）
      - name: Close issue silently (local/off mode)
        if: steps.mode.outputs.mode != 'api'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --reason completed || true
