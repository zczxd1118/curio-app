name: Process Curio Issue

# 当带 curio-add-domain 或 curio-generate 标签的 issue 被打开时立即触发
# - curio-add-domain: 跑 ingest_add_domain → 写 sources.yaml + 生成 explore.json
# - curio-generate: 跑 ingest_generate → 写 .pending_generate.json，评论"已排队"
# 两种情况都会立即触发一次 fetch-candidates（让候选池在 5 分钟内更新）
on:
  issues:
    types: [opened, labeled, reopened]

jobs:
  ingest-add-domain:
    # 兼容 label 没贴上的情况：title 前缀也算
    if: |
      contains(github.event.issue.labels.*.name, 'curio-add-domain') ||
      startsWith(github.event.issue.title, '[curio-add-domain]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Auto-label issue if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | grep -q '^curio-add-domain$'; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label curio-add-domain || true
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest add-domain issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_add_domain

      - name: Commit & push sources.yaml
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add sources.yaml topics/*.explore.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(ci): add domain via issue #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Check scoring mode
        id: addmode
        run: |
          mode=$(curl -sf https://api.curioradar.fun/scoring-mode | python -c "
          import sys, json
          try:
              d = json.load(sys.stdin); print(d.get('scoring_mode','local'))
          except: print('local')
          ")
          echo "mode=$mode" >> $GITHUB_OUTPUT

      - name: Trigger fetch + score-and-finalize (api 模式：5-10 分钟生效)
        if: steps.addmode.outputs.mode == 'api'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "⚠ GH_PAT 未配，无法触发 fetch+score"; exit 0; fi
          echo "🔄 触发 fetch-candidates..."
          gh workflow run fetch-candidates.yml -f reason="add-domain #${{ github.event.issue.number }} (api)"
          sleep 8
          run_id=$(gh run list --workflow=fetch-candidates.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch $run_id --exit-status || true
          echo "⚡ 触发 score-and-finalize..."
          gh workflow run score-and-finalize.yml -f cadence=daily

      - name: Trigger fetch only (local/off 模式)
        if: steps.addmode.outputs.mode != 'api'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run fetch-candidates.yml -f reason="add-domain #${{ github.event.issue.number }} (${{ steps.addmode.outputs.mode }})"
          fi

      - name: Comment on issue (按 mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.addmode.outputs.mode }}" = "api" ]; then
            BODY="✅ 领域已加入 sources.yaml + CI 已自动串联（fetch → score → finalize）

          **预计 5-10 分钟内主页出现新 chip + 邮箱收到内容**。

          全程在 GitHub Actions 跑，电脑可关机。"
          else
            BODY="✅ 领域已加入 sources.yaml + 触发候选池抓取（约 2 分钟）。

          ⚠ 当前评分模式：\`${{ steps.addmode.outputs.mode }}\`，**评分需要本地 WorkBuddy 跑**：
          - 必须电脑开机 + WorkBuddy 在跑
          - 等下个整点 hourly automation 触发评分 → finalize → 邮件
          - **预计 5-65 分钟生效**

          想 5 分钟生效：去 ⚙️ 设置 切到「API（无人值守）」。"
          fi
          gh issue comment ${{ github.event.issue.number }} --body "$BODY"

  ingest-delete-domain:
    if: |
      contains(github.event.issue.labels.*.name, 'curio-delete-domain') ||
      startsWith(github.event.issue.title, '[curio-delete-domain]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Auto-label issue if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | grep -q '^curio-delete-domain$'; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label curio-delete-domain || true
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest delete-domain issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURIO_ADMIN_TOKEN: ${{ secrets.CURIO_ADMIN_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_delete_domain

      - name: Commit & push sources.yaml
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add sources.yaml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(ci): delete domain via issue #${{ github.event.issue.number }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ 领域已从 sources.yaml 移除，订阅者已从该域退订。

          - 主页 chip 在下次重 build 后消失（最坏 24h，触发抓取或评分都会顺带 build）
          - 历史 markdown 不删，仍可通过直接 URL 访问
          - 想立即生效：去主页点任意域的「⚡ 立即生成」触发一次 finalize"

  ingest-generate:
    if: |
      contains(github.event.issue.labels.*.name, 'curio-generate') ||
      startsWith(github.event.issue.title, '[curio-generate]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Auto-label issue if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | grep -q '^curio-generate$'; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label curio-generate || true
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest generate issue (写 .pending_generate.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m agent.worker_sync ingest_generate

      - name: Commit & push pending queue
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add .pending_generate.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更（可能已经在 pending 中）"
          else
            git commit -m "chore(ci): queue generate request from issue #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Check scoring mode (公开端点，不需 secret)
        id: mode
        run: |
          mode=$(curl -sf https://api.curioradar.fun/scoring-mode | python -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('scoring_mode', 'local'))
          except Exception:
              print('local')
          ")
          echo "mode=$mode" >> $GITHUB_OUTPUT
          echo "scoring_mode=$mode"

      - name: Trigger fetch-candidates → wait → score-and-finalize (api mode)
        if: steps.mode.outputs.mode == 'api'
        env:
          # 必须用 GH_PAT（用户配的 PAT），默认 GITHUB_TOKEN 不能触发其他 workflow（403）
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ GH_PAT secret 未配置！请在 repo settings 加 GH_PAT。"
            exit 1
          fi
          echo "🔄 触发 fetch-candidates..."
          gh workflow run fetch-candidates.yml -f reason="generate #${{ github.event.issue.number }} (mode=api)"
          sleep 8
          run_id=$(gh run list --workflow=fetch-candidates.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "fetch run_id=$run_id"
          gh run watch $run_id --exit-status || true
          echo "⚡ 触发 score-and-finalize..."
          gh workflow run score-and-finalize.yml -f cadence=daily

      - name: Trigger fetch only (local/off mode)
        if: steps.mode.outputs.mode != 'api'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run fetch-candidates.yml -f reason="generate #${{ github.event.issue.number }} (mode=${{ steps.mode.outputs.mode }})"
          else
            echo "⚠ GH_PAT 未配，跳过 fetch 触发"
          fi

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "api" ]; then
            BODY="✅ 已收到（API 模式）

          链路：
          1. 候选池抓取（已触发，约 2 分钟）
          2. score-and-finalize 评分 + 渲染 + 邮件（已触发，约 3 分钟）

          **预计 5-7 分钟内主页 + 邮箱可见。**

          主页：https://curioradar.fun/"
          elif [ "${{ steps.mode.outputs.mode }}" = "off" ]; then
            BODY="⏸ 已收到，但当前评分模式为「暂停」。

          请去 https://curioradar.fun → ⚙️ 设置 → 切换到「本地」或「API」。"
          else
            BODY="✅ 已收到（本地模式）

          链路：
          1. 候选池正在重新抓取（约 2 分钟）
          2. 等下一个整点（最多 60 分钟），WorkBuddy 唤醒 Claude 评分

          **预计 5-65 分钟内主页 + 邮箱可见。**

          想真无人值守 < 5 分钟生效？去 ⚙️ 设置 切换到「API」模式。

          主页：https://curioradar.fun/"
          fi
          gh issue comment ${{ github.event.issue.number }} --body "$BODY"
